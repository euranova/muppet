[project]
name = "Muppet-XAI"
version = "0.1.3"
description = "Perturbation-based framework for understanding and interpreting Pytorch models"
authors = [
  { name = "Quentin Ferré", email = "quentin.ferre@euranova.eu" },
  { name = "Antoine Bonnefoy", email = "antoine.bonnefoy@euranova.eu" },
  { name = "Ismail Bachchar", email = "isbachchar@gmail.com" },
  { name = "Duc Thang Hoang", email = "ducthang.hoang@euranova.eu" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.3",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "hydra-ax-sweeper>=1.2.0",
    "hydra-core>=1.3.2",
    "hydra-joblib-launcher>=1.2.0",
    "tqdm>=4.67.1",
    "pandas>=2.2.3",
    "optuna-integration>=4.3.0",
    "aeon>=1.1.0",
    "pyts>=0.13.0",
    "tslearn>=0.6.3",
    "fiftyone>=1.5.2",
    "ipywidgets>=8.1.7",
    "loguru>=0.7.3",
    "matplotlib>=3.10.3",
    "seaborn>=0.13.2",
    "notebook>=7.4.2",
    "openml>=0.15.1",
    "quantus>=0.5.3",
    "ucimlrepo>=0.0.7",
    "xgboost>=3.0.2",
]

[project.urls]
Homepage = "https://code.euranova.eu/rd/taudos/muppet"

[project.scripts]
muppet-benchmark = "muppet.benchmark.run_benchmark:main"

[build-system]
requires = ["setuptools>=80.9"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["muppet", "muppet.*"]

[tool.setuptools.package-data]
"muppet" = ["*.yaml", "**/*.yaml"]

[dependency-groups]
test = [
    "shap>=0.47.2",
    "lime>=0.2.0.1",
    "coverage>=7.8.2",
    "pytest>=8.3.5",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.2",
    "mkdocs-material>=9.6.14",
    "mkdocs-mermaid2-plugin>=1.2.2",
    "mkdocstrings[python]>=0.29.1",
]
lint = [
    "ruff>=0.11.11",
]

[tool.uv]
default-groups = "all"

[tool.ruff]
# Set the maximum line length to 80.
line-length = 80
indent-width = 4
output-format = "json"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # isort
    "I",
    # Pydocstyle
    "D",
]
# Ignore some rules
# E501: line too long
# Some D rules: https://docs.astral.sh/ruff/rules/#pydocstyle-d
ignore = ["E501", "D104", "D205", "D301", "D415", "D417"]

[tool.ruff.lint.per-file-ignores]
# Ignore `F401`, `E402` (import violations) in all `__init__.py` files.
"__init__.py" = ["F401", "E402"]

[tool.ruff.lint.pydocstyle]
# Use "google" for Google-style docstrings, or "numpy", "pep257".
convention = "google"
