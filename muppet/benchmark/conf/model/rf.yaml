_target_: muppet.benchmark.models.classifier.Classifier
name: random_forest
model:
    _target_: sklearn.ensemble.RandomForestClassifier
    criterion: entropy
    max_depth: 20
pretrained: False
random_state: 105
n_trials: 20
n_jobs: 12 
cv: 5
scoring: balanced_accuracy
predict_proba_func: predict_proba #predict_log_proba
params_tuning:
    n_estimators:
        _target_: optuna.distributions.IntDistribution
        low: 10
        high: 100
        step: 10
    max_depth:
        _target_: optuna.distributions.IntDistribution
        low: 3
        high: 10
    min_samples_split:
        _target_: optuna.distributions.IntDistribution
        low: 2
        high: 20
    min_samples_leaf:
        _target_: optuna.distributions.IntDistribution
        low: 1
        high: 10
